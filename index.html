<!-- Tailwind (CDN build) + project token config -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:      '#12201C',
          inksoft:  '#1B2C25',
          paper:    '#F1E9D8',
          paperdark:'#E4D8BE',
          moss:     '#4A6B41',
          mossdark: '#2E4229',
          brass:    '#B08D57',
          rust:     '#8B3A2E',
          text:     '#241F1A',
          textsoft: '#5B5346',
          line:     '#C9BC9C',
        },
        fontFamily: {
          serif: ['Fraunces', 'serif'],
          mono:  ['"IBM Plex Mono"', 'monospace'],
          sans:  ['Inter', 'sans-serif'],
        },
      }
    }
  }
</script>

<link rel="stylesheet" href="styles.css">
</head>
<body class="m-0 bg-ink text-paper font-sans min-h-screen flex justify-center px-4 pt-8 pb-16">

<div class="wrap w-full max-w-[460px]">
  <p class="font-mono text-[12.5px] tracking-[0.02em] text-brass mb-1">Field journal <span class="text-paper/55">— vocabulary specimens</span></p>
  <h1 class="font-serif font-medium text-[26px] leading-[1.25] mb-7 text-paper max-w-[340px]">One new word, collected each day.</h1>

  <div class="card relative bg-paper text-text rounded-[3px] px-6 pt-[26px] pb-6 shadow-[0_24px_48px_-20px_rgba(0,0,0,0.55),0_2px_0_rgba(0,0,0,0.15)] border border-black/[0.06] overflow-hidden" id="card">
    <!-- pinhole -->
    <div class="absolute top-[14px] left-1/2 -translate-x-1/2 w-2 h-2 rounded-full bg-[radial-gradient(circle_at_35%_35%,#8f8574,#5c5546)] shadow-[0_1px_2px_rgba(0,0,0,0.4)]"></div>

    <div class="flex justify-between items-baseline font-mono text-[11.5px] text-textsoft pb-[14px] mb-[18px] border-b border-dashed border-line pt-[6px]">
      <span>Today's specimen</span>
      <span class="text-mossdark font-medium" id="specimenNum">No. 001</span>
    </div>
    <p class="font-serif font-semibold text-[40px] leading-[1.05] tracking-[-0.01em] mb-1.5 text-text" id="word">—</p>
    <div class="flex items-center gap-2.5 mb-[18px] flex-wrap">
      <span class="font-mono text-[13.5px] text-mossdark" id="ipa"></span>
      <span class="font-sans text-xs italic text-textsoft px-2 py-0.5 border border-line rounded-full" id="pos"></span>
    </div>
    <p class="text-[16.5px] leading-[1.55] mb-4 text-text" id="meaning"></p>
    <p class="text-[14.5px] leading-[1.6] text-textsoft pl-3.5 border-l-2 border-moss m-0" id="example"></p>

    <div class="stamp absolute bottom-[18px] right-[18px] w-[78px] h-[78px] border-[2.5px] border-rust rounded-full flex items-center justify-center text-rust font-mono text-[10.5px] font-medium text-center leading-[1.3] -rotate-[14deg] scale-[0.4] opacity-0 [mix-blend-mode:multiply] pointer-events-none transition-[transform,opacity] duration-[350ms] ease-[cubic-bezier(.2,1.4,.4,1)] motion-reduce:transition-none" id="stamp">
      <div class="absolute inset-[6px] border border-rust rounded-full"></div>
      COLLECTED<br><span id="stampDate"></span>
    </div>
  </div>

  <div class="actions mt-[22px] flex flex-col gap-2.5">
    <button class="btn-primary font-sans text-[15px] font-semibold rounded-[3px] px-[18px] py-[13px] cursor-pointer border-none transition-[filter,transform] duration-150 active:translate-y-px bg-moss text-paper hover:brightness-[1.08] disabled:bg-inksoft disabled:text-paper/40 disabled:cursor-default disabled:hover:brightness-100" id="collectBtn">Collect specimen</button>
    <p class="text-[12.5px] text-paper/55 text-center mt-0.5 mb-0" id="note"></p>
  </div>

  <div class="flex gap-3 mt-[26px]">
    <div class="flex-1 bg-inksoft border border-paper/[0.08] rounded-[3px] px-[14px] pt-[14px] pb-3">
      <div class="font-serif text-[26px] font-semibold text-brass leading-none" id="statTotal">0</div>
      <div class="font-sans text-xs text-paper/60 mt-1">Words collected</div>
    </div>
    <div class="flex-1 bg-inksoft border border-paper/[0.08] rounded-[3px] px-[14px] pt-[14px] pb-3">
      <div class="font-serif text-[26px] font-semibold text-brass leading-none" id="statStreak">0</div>
      <div class="font-sans text-xs text-paper/60 mt-1">Day streak</div>
    </div>
  </div>

  <button class="w-full mt-[14px] text-left bg-transparent text-paper/80 border-none font-mono text-[12.5px] py-2 px-0.5 flex justify-between items-center hover:text-paper cursor-pointer" id="collectionToggle">
    <span>View collection</span>
    <span class="inline-block transition-transform duration-200" id="chev">▾</span>
  </button>
  <div class="hidden mt-1.5 border-t border-paper/10 pt-2.5" id="collection">
    <div class="text-[13px] text-paper/50 py-2.5 px-1" id="collectionEmpty">Nothing collected yet — come back once you've gathered your first word.</div>
  </div>

  <button class="block mx-auto mt-[22px] bg-transparent border-none text-paper/30 text-[11.5px] underline cursor-pointer p-1 hover:text-paper/55" id="resetLink">Reset my collection</button>
</div>

<div class="hidden fixed inset-0 bg-black/55 items-center justify-center p-5 z-10" id="modalBackdrop">
  <div class="card relative bg-paper text-text rounded-[3px] px-6 pt-[26px] pb-6 shadow-[0_24px_48px_-20px_rgba(0,0,0,0.55),0_2px_0_rgba(0,0,0,0.15)] border border-black/[0.06] overflow-hidden max-w-[340px]">
    <div class="flex justify-between items-baseline font-mono text-[11.5px] text-textsoft pb-[14px] mb-[18px] border-b border-dashed border-line pt-[6px]">
      <span>Specimen</span>
      <span class="text-mossdark font-medium" id="modalNum"></span>
    </div>
    <p class="font-serif font-semibold text-[40px] leading-[1.05] tracking-[-0.01em] mb-1.5 text-text" id="modalWord"></p>
    <div class="flex items-center gap-2.5 mb-[18px] flex-wrap">
      <span class="font-mono text-[13.5px] text-mossdark" id="modalIpa"></span>
      <span class="font-sans text-xs italic text-textsoft px-2 py-0.5 border border-line rounded-full" id="modalPos"></span>
    </div>
    <p class="text-[16.5px] leading-[1.55] mb-4 text-text" id="modalMeaning"></p>
    <p class="text-[14.5px] leading-[1.6] text-textsoft pl-3.5 border-l-2 border-moss m-0" id="modalExample"></p>
    <div class="flex flex-col gap-2.5 mt-4">
      <button class="btn-ghost font-sans text-[13.5px] font-medium rounded-[3px] px-4 py-2.5 cursor-pointer bg-transparent text-paper border border-paper/25 hover:border-paper/50" id="modalClose">Close</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
